# Production overlay for a single VPS. Use together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Only Caddy is reachable from the internet (80/443, automatic HTTPS); everything else stays on the
# private Docker network.

services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  api:
    ports: !reset []
    environment:
      # uploads live in the api_storage volume below, which survives restarts and redeploys
      LOCAL_STORAGE_PERSISTENT: "true"
    volumes:
      - api_storage:/repo/apps/api/storage

  web:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?WEB_DOMAIN is required}
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # nightly pg_dump into ./backups on the host, keeping the last BACKUP_KEEP_DAYS days
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-app}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-app}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          file="/backups/db-$$(date +%Y-%m-%d-%H%M).sql.gz"
          if pg_dump --no-owner --no-privileges | gzip > "$$file"; then
            echo "[backup] wrote $$file"
          else
            echo "[backup] FAILED"; rm -f "$$file"
          fi
          find /backups -name 'db-*.sql.gz' -mtime +"$$BACKUP_KEEP_DAYS" -delete
          sleep 86400
        done

volumes:
  api_storage:
  caddy_data:
  caddy_config:
